<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>京东 AI 搜索 · 回复模式设计台</title>
  <meta name="description" content="面向购物全旅程的八种 AI 搜索回复模式交互演示" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="./jd-reply-modes-files/fonts.css?v=2" rel="stylesheet">
  <script src="./jd-reply-modes-files/lucide.min.js?v=2"></script>
  <link rel="stylesheet" href="./jd-reply-modes-files/styles.css?v=2" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="topbar">
    <a class="brand" href="#" onclick="return false;" aria-label="京东 AI 搜索设计台首页">
      <span class="brand-mark">JD</span>
      <span>AI 搜索 · 回复模式设计台</span>
    </a>
    <div class="top-actions">
      <span class="status"><i data-lucide="sparkles"></i> Concept Demo</span>
      <button class="icon-button" id="helpBtn" aria-label="查看使用说明"><i data-lucide="circle-help"></i></button>
    </div>
  </header>

  <main class="app-shell">
    <section class="intro">
      <div>
        <div class="eyebrow">SHOPPING JOURNEY × USER INTENT</div>
        <h1>让每一种问题，都得到<br><span>恰到好处的回答</span></h1>
      </div>
      <p>以京东当前“导语＋品类说明＋商品列表＋追问词”的基础骨架为起点，再根据意图切换 8 种信息组织方式。</p>
    </section>

    <section class="journey" aria-label="购物旅程">
      <div class="journey-line"><span id="journeyProgress"></span></div>
      <button class="stage active" data-stage="pre"><span class="stage-dot"></span><small>购前</small><strong>发现与探索</strong><em>5 种模式</em></button>
      <button class="stage" data-stage="during"><span class="stage-dot"></span><small>购中</small><strong>对比与决策</strong><em>3 种模式</em></button>
    </section>

    <section class="workspace">
      <aside class="mode-panel">
        <div class="panel-title"><span>回复模式</span><span class="count">8</span></div>
        <div id="modeList" class="mode-list"></div>
        <div class="principle-card">
          <i data-lucide="scan-search"></i>
          <div><strong>设计原则</strong><p>先回答“为什么”，再回答“买什么”；每次只推进一个决策。</p></div>
        </div>
      </aside>

      <section class="preview-panel">
        <div class="preview-toolbar">
          <div class="view-tabs"><button class="active" data-view="user">用户视角</button><button data-view="structure">结构拆解</button></div>
          <div class="device-pill"><i data-lucide="smartphone"></i> 京东 App</div>
        </div>

        <div class="phone-wrap">
          <div class="phone">
            <div class="phone-status"><span>9:41</span><span><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span></div>
            <div class="search-bar"><i data-lucide="arrow-left"></i><div><i data-lucide="search"></i><span id="queryText"></span></div><i data-lucide="more-horizontal"></i></div>
            <div class="conversation" id="conversation"></div>
            <div class="composer"><button><i data-lucide="image"></i></button><div>继续问点什么…</div><button class="send"><i data-lucide="arrow-up"></i></button></div>
          </div>
        </div>
      </section>

      <aside class="spec-panel">
        <div class="spec-head">
          <div><span id="modeNumber">01</span><small id="stageName">购前导购</small></div>
          <div class="mode-icon" id="modeIcon"><i data-lucide="compass"></i></div>
        </div>
        <h2 id="modeTitle">灵感探索型</h2>
        <p id="modeDescription"></p>
        <div class="spec-block"><h3>识别信号</h3><div id="signals" class="chips"></div></div>
        <div class="spec-block"><h3>回复骨架</h3><ol id="structureList" class="structure-list"></ol></div>
        <div class="do-dont">
          <div><span class="good"><i data-lucide="check"></i> 要做</span><p id="doText"></p></div>
          <div><span class="bad"><i data-lucide="x"></i> 避免</span><p id="dontText"></p></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast"><i data-lucide="info"></i><span>点击左侧 8 种模式，可切换完整回复示例与设计规则。</span></div>
  <script src="./jd-reply-modes-files/app.js?v=2"></script>
</body>
</html>
